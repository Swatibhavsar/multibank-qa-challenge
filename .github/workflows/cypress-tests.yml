name: Cypress E2E Tests

on:
  push:
    branches: [ main, develop, master ]
  pull_request:
    branches: [ main, develop, master ]
  schedule:
    # Run tests daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  cypress-tests:
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox, edge]
        test-suite: [
          'logo',
          'navigation',
          'trading',
          'content',
          'company'
        ]

    name: ${{ matrix.browser }} - ${{ matrix.test-suite }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Cypress tests - ${{ matrix.test-suite }} on ${{ matrix.browser }}
        run: npm run test:${{ matrix.test-suite }} -- --browser ${{ matrix.browser }}
        continue-on-error: true

      - name: Generate test report
        if: always()
        run: npm run report
        continue-on-error: true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: cypress-reports-${{ matrix.browser }}-${{ matrix.test-suite }}
          path: cypress/reports/
          retention-days: 30

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: cypress-screenshots-${{ matrix.browser }}-${{ matrix.test-suite }}
          path: cypress/screenshots/
          retention-days: 7

      - name: Upload videos
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: cypress-videos-${{ matrix.browser }}-${{ matrix.test-suite }}
          path: cypress/videos/
          retention-days: 7

  smoke-tests:
    runs-on: ubuntu-latest
    name: Smoke Tests (Chrome)

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run smoke tests
        run: npm run test:smoke -- --browser chrome

      - name: Upload smoke test reports
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: smoke-test-reports
          path: cypress/reports/
          retention-days: 30

  all-tests:
    runs-on: ubuntu-latest
    name: All Tests (Chrome)

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run all tests
        run: npm run test:all -- --browser chrome

      - name: Generate comprehensive report
        if: always()
        run: npm run report
        continue-on-error: true

      - name: Upload comprehensive test reports
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: all-tests-report
          path: cypress/reports/
          retention-days: 30

      - name: Upload all screenshots
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: all-tests-screenshots
          path: cypress/screenshots/
          retention-days: 7

      - name: Upload all videos
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: all-tests-videos
          path: cypress/videos/
          retention-days: 7

  test-results-summary:
    runs-on: ubuntu-latest
    name: Test Results Summary
    if: always()
    needs: [cypress-tests, smoke-tests, all-tests]

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v3
        with:
          path: test-artifacts

      - name: Display test results
        run: |
          echo "## Test Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ All test runs completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 Test Suites Executed:" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Logo & Redirect Tests" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Navigation Tests" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Trading Functionality Tests" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Content Validation Tests" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Company Page Tests" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🌐 Browsers Tested:" >> $GITHUB_STEP_SUMMARY
          echo "- Chrome" >> $GITHUB_STEP_SUMMARY
          echo "- Firefox" >> $GITHUB_STEP_SUMMARY
          echo "- Edge" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Artifacts:" >> $GITHUB_STEP_SUMMARY
          echo "- Test Reports (Mochawesome)" >> $GITHUB_STEP_SUMMARY
          echo "- Screenshots (on failure)" >> $GITHUB_STEP_SUMMARY
          echo "- Test Videos" >> $GITHUB_STEP_SUMMARY

      - name: Comment PR with test results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ **Cypress E2E Tests Completed!**\n\n📊 **Test Suites:**\n- Logo & Redirect\n- Navigation\n- Trading Functionality\n- Content Validation\n- Company Page\n\n🌐 **Browsers:** Chrome, Firefox, Edge\n\n📈 Check the [Actions tab](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) for detailed reports and artifacts.'
            })

          path: cypress/videos/
